<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>FM Manager — Web MVP</title>
  <link rel="stylesheet" href="/assets/style.css">
</head>
<body>
  <header>
    <h1>FM Manager — Web MVP</h1>
    <nav id="top-nav">
      <button id="btnNew">Новая игра</button>
      <button id="btnLoad">Загрузить</button>
      <button id="btnEditor">Редактор БД</button>
      <button id="btnLeague">Лига / Календарь</button>
      <button id="btnSim">Симуляция матча</button>
    </nav>
  </header>

  <main>
    <section id="view-menu" class="view">
      <p class="muted">Добро пожаловать — менеджер (MVP). Нажмите «Новая игра», чтобы создать карьеру или «Редактор БД», чтобы отредактировать игроков.</p>
    </section>

    <section id="view-editor" class="view" style="display:none">
      <h2>Редактор Базы</h2>
      <div id="editor-controls">
        <button id="btnAddPlayer">Добавить игрока</button>
        <button id="btnSaveDb">Сохранить базу</button>
      </div>
      <div id="playersList"></div>
    </section>

    <section id="view-league" class="view" style="display:none">
      <h2>Таблица лиги</h2>
      <div id="leagueTable"></div>
    </section>

    <section id="view-sim" class="view" style="display:none">
      <h2>Симуляция матча</h2>
      <div>
        <select id="selectHome"></select>
        <select id="selectAway"></select>
        <button id="btnRunMatch">Запустить матч</button>
      </div>
      <div id="matchLog"></div>
    </section>

  </main>

  <footer>
    <div class="muted">Сохранение: localStorage. Эта страница — MVP для быстрой демонстрации.</div>
  </footer>

  <script src="/assets/app.js"></script>
</body>
</html>
